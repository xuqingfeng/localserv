name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

      - name: Cross-compile check (release targets)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux  GOARCH=amd64 go build -o dist/localserv_linux_amd64 .
          CGO_ENABLED=0 GOOS=linux  GOARCH=arm64 go build -o dist/localserv_linux_arm64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o dist/localserv_darwin_amd64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o dist/localserv_darwin_arm64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o dist/localserv_windows_amd64.exe .
